name: ci

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

env:
  # Force the exact pure-Python FNV chain so CI does not depend on a compiler.
  TRAJECTORY_CORE_FNV: python

jobs:
  check:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install check tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8" "ruff>=0.6" "mypy>=1.11" "build>=1.2"
      - name: Run the single check entry point
        run: python tools/check.py
